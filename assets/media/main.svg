<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">

  <defs>
    <marker id="velArrow" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#72D8FA"/>
    </marker>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Two-lane highway. Parallel geometry on all three road lines. -->
  <path d="M 770 165 C 1030 148, 1300 150, 1600 180"
        fill="none" stroke="#D5EAF3" stroke-width="2.2" stroke-opacity="0.14"/>
  <path d="M 770 325 C 1030 308, 1300 310, 1600 340"
        fill="none" stroke="#D5EAF3" stroke-width="3"
        stroke-opacity="0.19" stroke-dasharray="24 20"/>
  <path d="M 770 485 C 1030 468, 1300 470, 1600 500"
        fill="none" stroke="#D5EAF3" stroke-width="2.2" stroke-opacity="0.14"/>

  <path d="M 770 165 C 1030 148, 1300 150, 1600 180
           L 1600 500
           C 1300 470, 1030 468, 770 485 Z"
        fill="#A8C6D3" opacity="0.025"/>

  <!-- Fast rear vehicle in the left/overtaking lane -->
  <g transform="translate(1010 248)">
    <ellipse cx="0" cy="0" rx="61" ry="34"
             fill="none" stroke="#64CEF4" stroke-width="2"
             stroke-opacity="0.15" stroke-dasharray="7 8"/>
    <rect x="-30" y="-17" width="60" height="34" rx="10"
          fill="#67CFF4" opacity="0.54"/>
    <rect x="-14" y="-13" width="28" height="26" rx="5"
          fill="#E5F8FF" opacity="0.14"/>
  </g>

  <!-- Ego vehicle in the right/driving lane -->
  <g transform="translate(1135 405)">
    <ellipse cx="0" cy="0" rx="64" ry="35"
             fill="none" stroke="#56C9F2" stroke-width="2"
             stroke-opacity="0.18" stroke-dasharray="7 8"/>
    <rect x="-32" y="-18" width="64" height="36" rx="10"
          fill="#45C5F1" opacity="0.68"/>
    <rect x="-15" y="-14" width="30" height="28" rx="5"
          fill="#E5F8FF" opacity="0.18"/>
  </g>

  <!-- Slow lead vehicle in the right lane -->
  <g transform="translate(1390 420)">
    <ellipse cx="0" cy="0" rx="57" ry="31"
             fill="none" stroke="#CDE5EE" stroke-width="1.8"
             stroke-opacity="0.10" stroke-dasharray="7 8"/>
    <rect x="-29" y="-16" width="58" height="32" rx="9"
          fill="#B9CDD5" opacity="0.34"/>
    <rect x="-13" y="-12" width="26" height="24" rx="5"
          fill="#EEF8FB" opacity="0.10"/>
  </g>

  <!-- Straight velocity vectors. Length directly encodes relative speed. -->
  <g fill="none" stroke="#72D8FA" stroke-linecap="round" marker-end="url(#velArrow)">
    <line x1="1048" y1="248" x2="1242" y2="248"
          stroke-width="3.2" stroke-opacity="0.42"/>
    <line x1="1174" y1="405" x2="1310" y2="405"
          stroke-width="2.8" stroke-opacity="0.36"/>
    <line x1="1425" y1="420" x2="1500" y2="420"
          stroke-width="2.4" stroke-opacity="0.28"/>
  </g>

  <!-- Candidate overtaking trajectory: smooth lane-change S-curve -->
  <path d="M 1165 405
           C 1195 405, 1215 397, 1234 378
           C 1260 351, 1268 307, 1300 282
           C 1330 258, 1380 252, 1475 258"
        fill="none" stroke="#77D8F8" stroke-width="3.2"
        stroke-linecap="round" stroke-dasharray="9 10"
        stroke-opacity="0.40"/>

  <!-- Alternative keep-lane trajectory -->
  <path d="M 1165 405
           C 1225 406, 1285 410, 1325 414"
        fill="none" stroke="#B3DDE9" stroke-width="2.2"
        stroke-linecap="round" stroke-dasharray="5 10"
        stroke-opacity="0.18"/>

  <!-- V2V communication links -->
  <g fill="none" stroke="#75D4F5" stroke-width="1.5"
     stroke-opacity="0.115" stroke-dasharray="3 8">
    <path d="M 1010 248 C 1050 300, 1090 350, 1135 405"/>
    <path d="M 1135 405 C 1215 410, 1305 416, 1390 420"/>
    <path d="M 1010 248 C 1135 285, 1260 345, 1390 420"/>
  </g>

  <g fill="#9CE7FF" opacity="0.21" filter="url(#softGlow)">
    <circle cx="1060" cy="310" r="3"/>
    <circle cx="1088" cy="345" r="3"/>
    <circle cx="1230" cy="411" r="3"/>
    <circle cx="1300" cy="416" r="3"/>
    <circle cx="1160" cy="294" r="3"/>
    <circle cx="1265" cy="350" r="3"/>
  </g>

</svg>
